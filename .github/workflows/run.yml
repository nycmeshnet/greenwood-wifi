name: Run optimizer (zero-host)

on:
  workflow_dispatch:
    inputs:
      range-2g:
        description: "2.4 GHz open-field range, ft (larger = fewer APs)"
        default: "2000"
        required: true
      range-5g:
        description: "5 GHz open-field range, ft"
        default: "1250"
        required: true
      range-6g:
        description: "6 GHz range, ft — empty = tri-band off"
        default: ""
        required: false
      coverage:
        description: "full = whole boundary, paths = within 15 ft of paths"
        type: choice
        options: [full, paths]
        default: full
        required: true
      relation-id:
        description: "OSM relation ID for site boundary (1370699 = Green-Wood)"
        default: "1370699"
        required: true
      panel-w:
        description: "Panel nameplate watts"
        default: "100"
        required: true
      load-w:
        description: "AP draw watts (demand = load x 24h)"
        default: "10"
        required: true
      derating:
        description: "Loss factor 0-1 (temp/wiring/soiling)"
        default: "0.80"
        required: true
      tilt:
        description: "Panel tilt deg (~latitude optimal)"
        default: "40"
        required: true
      freeze-thresh-f:
        description: "Months colder than this F are excluded"
        default: "34"
        required: true
      candidate-spacing:
        description: "[advanced] Possible-spot grid, m (auto-grows with range)"
        default: "20"
        required: true
      ilp-spacing:
        description: "[advanced] Must-cover grid, m (smaller = slower solve)"
        default: "20"
        required: true
      test-spacing:
        description: "[advanced] Reporting grid only, m"
        default: "10"
        required: true
      mount-height:
        description: "AP pole mount height, m"
        default: "2.0"
        required: true
      client-height:
        description: "Client device height, m (phone in hand)"
        default: "2.0"
        required: true
      shade-radius:
        description: "[advanced] Tree shade radius, m (0 = auto)"
        default: "50"
        required: true
      marginal-penalty:
        description: "[advanced] 1.0 = accept marginal shade, 2.0 = strongly avoid"
        default: "1.5"
        required: true
      refresh-cache:
        description: "Re-fetch OSM/USGS/NASA live (off = use committed baseline cache)"
        type: boolean
        default: false
        required: false
      publish:
        description: "Publish results to gh-pages?"
        type: boolean
        default: true
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: optimizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimizer
        run: |
          ARGS="--range-2g ${{ inputs.range-2g }} --range-5g ${{ inputs.range-5g }}"
          if [ -n "${{ inputs.range-6g }}" ]; then
            ARGS="$ARGS --range-6g ${{ inputs.range-6g }}"
          fi
          ARGS="$ARGS --coverage ${{ inputs.coverage }}"
          ARGS="$ARGS --relation-id ${{ inputs.relation-id }}"
          ARGS="$ARGS --panel-w ${{ inputs.panel-w }} --load-w ${{ inputs.load-w }}"
          ARGS="$ARGS --derating ${{ inputs.derating }} --tilt ${{ inputs.tilt }}"
          ARGS="$ARGS --freeze-thresh-f ${{ inputs.freeze-thresh-f }}"
          ARGS="$ARGS --candidate-spacing ${{ inputs.candidate-spacing }}"
          ARGS="$ARGS --ilp-spacing ${{ inputs.ilp-spacing }}"
          ARGS="$ARGS --test-spacing ${{ inputs.test-spacing }}"
          ARGS="$ARGS --mount-height-m ${{ inputs.mount-height }} --client-height-m ${{ inputs.client-height }}"
          ARGS="$ARGS --shade-radius ${{ inputs.shade-radius }}"
          ARGS="$ARGS --marginal-penalty ${{ inputs.marginal-penalty }}"
          if [ "${{ inputs.refresh-cache }}" = "true" ]; then
            ARGS="$ARGS --no-cache"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ap-placement-${{ github.run_number }}
          path: |
            output/ap_placement.json
            output/ap_placement.kml
            output/summary.md
          retention-days: 90

      - name: Prepare pages dir
        if: inputs.publish == true
        run: |
          mkdir -p pages
          cp viewer/index.html pages/index.html
          cp output/ap_placement.json pages/ap_placement.json
          cp output/ap_placement.kml pages/ap_placement.kml
          cp output/summary.md pages/summary.md
          cat > pages/_run.json <<EOF
          {"run_number": ${{ github.run_number }}, "ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}
          EOF

      - name: Publish to gh-pages
        if: inputs.publish == true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pages
          keep_files: false
